name: Auto Sync Fork

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 时间 2 点（北京时间早上 10 点）自动执行
  workflow_dispatch: # 保留此项，让你随时可以点击按钮手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} --branch main
